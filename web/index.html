<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RAC Dispatch - Floor Entry</title>
<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.1/dist/css/tabulator_simple.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
<style>*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;background:#f4f5f3;color:#1c1c1c}.bar{background:#1e4620;color:#fff;padding:12px 16px;font-size:18px;font-weight:bold}.tabs{display:flex;gap:6px;padding:10px;background:#fff;border-bottom:1px solid #e2e2e2}.tabs button{padding:10px 18px;font-size:15px;border:1px solid #1e4620;background:#fff;color:#1e4620;border-radius:8px;cursor:pointer}.tabs button.on{background:#1e4620;color:#fff}.wrap{padding:12px}.actions{margin:10px 0;display:flex;gap:8px;align-items:center}.actions button{padding:10px 18px;font-size:15px;border:0;border-radius:8px;cursor:pointer}.save{background:#1e4620;color:#fff;font-weight:bold}.add{background:#fff;border:1px solid #bbb!important;color:#333}#status{font-size:14px;margin-left:8px}.hide{display:none}</style></head><body>
<div class="bar">RAC Dispatch - Floor Entry</div>
<div class="tabs"><button id="t-age" class="on" onclick="show('age')">Ageing</button><button id="t-pack" onclick="show('pack')">Packing</button><button id="t-prod" onclick="show('prod')">Production</button></div>
<div class="wrap"><div id="w-age"><div id="age"></div></div><div id="w-pack" class="hide"><div id="pack"></div></div><div id="w-prod" class="hide"><div id="prod"></div></div>
<div class="actions"><button class="add" onclick="addRows()">+ 10 rows</button><button class="save" onclick="save()">Save to database</button><span id="status"></span></div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://qhvtrlktxfnvuijokkds.supabase.co','sb_publishable_DcvIumd6LZaeq8xCyhk9GA_Eew-QZ9V');
const T = window.Tabulator;
let custNames=[], custMap={}, current='age';
function blanks(n){var a=[];for(var i=0;i<n;i++)a.push({});return a;}
function num(v){v=(''+(v==null?'':v)).trim();return v===''?null:Number(v);}
function ist(){var d=new Date();return {date:d.toLocaleDateString('en-CA'),time:d.toLocaleTimeString('en-GB')};}
function webResult(w){var p=(''+(w==null?'':w)).split(/[\s,]+/).filter(Boolean).map(Number).filter(function(x){return !isNaN(x);});if(!p.length)return '';return Math.min.apply(null,p)>=7?'Pass':'Re-age';}
function cid(name){return custMap[(''+(name==null?'':name)).trim().toLowerCase()]||null;}
function st(m,err){var s=document.getElementById('status');s.textContent=m;s.style.color=err?'#a32d2d':'#1e4620';}
function mapAge(r){var t=ist();return {shift:r.shift||null,aging_no:r.aging_no||null,section_no:r.section_no||null,customer_id:cid(r.customer),cut_length:r.cut_length||null,wt_pc:num(r.wt_pc),total_weight:num(r.total_weight),finish:r.finish||null,webster:r.webster||null,result:webResult(r.webster),entry_date:t.date,out_time:t.time,cleared_by:r.cleared_by||null,remarks:r.remarks||null};}
function mapPack(r){var t=ist();return {bundle_no:r.bundle_no||null,section_no:r.section_no||null,section_name:r.section_name||null,cut_length:r.cut_length||null,bundle_wt:num(r.bundle_wt),pcs:num(r.pcs),customer_id:cid(r.customer),packed_date:t.date,packed_by:r.packed_by||null,status:'In Stock',remarks:r.remarks||null};}
function mapProd(r){var t=ist();var wt=num(r.wt_pc),pc=num(r.good_pcs);return {shift:r.shift||null,press:r.press||null,die_no:r.die_no||null,section_name:r.section_name||null,alloy:r.alloy||null,cut_length:r.cut_length||null,wt_pc:wt,good_pcs:pc,kg:(wt!=null&&pc!=null)?Math.round(wt*pc*10)/10:null,customer_id:cid(r.customer),entry_date:t.date,notes:r.notes||null};}
var custEd=function(){return {values:custNames,autocomplete:true,listOnEmpty:true,freetext:true};};
var ageCols=[{title:'Shift',field:'shift',editor:'list',editorParams:{values:['A','B','C']},width:75},{title:'Aging No',field:'aging_no',width:90},{title:'Section No',field:'section_no',width:100},{title:'Customer',field:'customer',editor:'list',editorParams:custEd,width:160},{title:'Cut Length',field:'cut_length',width:95},{title:'Wt/Pc',field:'wt_pc',width:75},{title:'Total Wt',field:'total_weight',width:85},{title:'Finish',field:'finish',editor:'list',editorParams:{values:['Mill','Powder coat','Anodise']},width:115},{title:'Webster',field:'webster',width:130},{title:'Cleared By',field:'cleared_by',width:100},{title:'Remarks',field:'remarks',width:120}];
var packCols=[{title:'Bundle No',field:'bundle_no',width:110},{title:'Section No',field:'section_no',width:100},{title:'Section Name',field:'section_name',width:130},{title:'Cut Length',field:'cut_length',width:95},{title:'Bundle Wt',field:'bundle_wt',width:95},{title:'Pcs',field:'pcs',width:70},{title:'Customer',field:'customer',editor:'list',editorParams:custEd,width:160},{title:'Packed By',field:'packed_by',width:100},{title:'Remarks',field:'remarks',width:120}];
var prodCols=[{title:'Shift',field:'shift',editor:'list',editorParams:{values:['A','B','C']},width:75},{title:'Press',field:'press',editor:'list',editorParams:{values:['900-A','900-B','1100-A','1100-B','1800']},width:95},{title:'Die No',field:'die_no',width:90},{title:'Section Name',field:'section_name',width:130},{title:'Alloy',field:'alloy',editor:'list',editorParams:{values:['HE9','6061','6063','HARD','SPL']},width:90},{title:'Cut Length',field:'cut_length',width:95},{title:'Wt/Pc',field:'wt_pc',width:75},{title:'Good Pcs',field:'good_pcs',width:85},{title:'Customer',field:'customer',editor:'list',editorParams:custEd,width:160},{title:'Notes',field:'notes',width:120}];
function mk(sel,cols){return new T(sel,{data:blanks(20),columns:cols,layout:'fitColumns',height:'60vh',columnDefaults:{headerSort:false,editor:'input',resizable:true},clipboard:true,clipboardPasteAction:'replace'});}
var tAge=mk('#age',ageCols),tPack=mk('#pack',packCols),tProd=mk('#prod',prodCols);
var reg={age:{t:tAge,tab:'ageing',map:mapAge},pack:{t:tPack,tab:'ready',map:mapPack},prod:{t:tProd,tab:'production',map:mapProd}};
window.show=function(k){['age','pack','prod'].forEach(function(x){document.getElementById('w-'+x).classList.toggle('hide',x!==k);document.getElementById('t-'+x).classList.toggle('on',x===k);});current=k;st('');};
window.addRows=function(){var t=reg[current].t;for(var i=0;i<10;i++)t.addRow({});};
window.save=async function(){var o=reg[current];var rows=o.t.getData().filter(function(r){return Object.keys(r).some(function(k){return (''+(r[k]==null?'':r[k])).trim()!=='';});});if(!rows.length){st('Nothing to save');return;}var recs=rows.map(o.map);if(o.tab==='ready'){var b=recs.length;recs=recs.filter(function(x){return x.bundle_no;});if(recs.length<b)st((b-recs.length)+' row(s) had no bundle no and were skipped. ');}if(!recs.length){return;}st('Saving '+recs.length+'...');var res=await sb.from(o.tab).insert(recs);if(res.error){st('Error: '+res.error.message,true);return;}o.t.setData(blanks(20));st(recs.length+' saved to '+o.tab+' (OK)');};
var cr=await sb.from('customers').select('customer_id,name').order('name');
if(cr.data){cr.data.forEach(function(c){custMap[(''+c.name).toLowerCase()]=c.customer_id;});custNames=cr.data.map(function(c){return c.name;});st(custNames.length+' customers loaded - ready');}else{st('Customer load failed: '+(cr.error&&cr.error.message),true);}
</script></body></html>
